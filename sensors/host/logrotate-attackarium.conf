# Install on the sensor host at provision time. Not applied by this repository.
# Deletes raw JSONL within one day. copytruncate keeps OpenCanary's open file handle.
/var/log/attackarium/*.jsonl /var/log/attackarium/*.jsonl.* {
    daily
    rotate 1
    maxage 1
    missingok
    notifempty
    copytruncate
}
