name: Operator alerts (Slack)

# #32: every 15 minutes, check sensor heartbeat, OS update freshness, active
# sensors, and database size, and notify Slack when an alert starts, resolves,
# or is still active a day later (state in public.ops_alert_state). The run
# fails (GitHub emails the maintainer) only when the check itself cannot run,
# including a missing or broken Slack webhook. Logs are public: counts only.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check sensor and database health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate and notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Optional repository variable; defaults to the Free plan's 500 MB.
          OPS_DB_QUOTA_MB: ${{ vars.OPS_DB_QUOTA_MB }}
        run: node jobs/ops-alerts/run.ts
