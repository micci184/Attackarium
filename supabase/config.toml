# Supabase local development configuration
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "attackarium"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Storage stays available for the local CLI, but MVP does not create a bucket.
# Raw HTTP bodies are not stored in Supabase Storage or AWS S3.
[storage]
enabled = true
file_size_limit = "256KiB"

# Ingest Edge Function authenticates sensors via per-sensor HMAC + timestamp + nonce
# rather than Supabase Auth JWTs. Keep verify_jwt = false and enforce HMAC strictly in code.
[functions.ingest]
verify_jwt = false

# ops-alerts is called by pg_cron (pg_net) with a shared Bearer secret
# (OPS_ALERTS_CRON_SECRET, also in Vault), not a Supabase Auth JWT. The
# function refuses every call when that secret is unset.
[functions.ops-alerts]
verify_jwt = false
