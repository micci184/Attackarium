# /etc/systemd/system/apt-daily-upgrade.service.d/attackarium-status.conf
# Verified automatic-update status for /admin (ADR-027).
# Pre: refresh package lists and record THIS attempt's outcome (exit status).
# Post: record success only if that refresh succeeded and the upgrade run that
# followed finished cleanly. "-" keeps these checks from failing the apt unit.
[Service]
ExecStartPre=-/usr/local/sbin/record_os_update_status.sh refresh
ExecStartPost=-/usr/local/sbin/record_os_update_status.sh record
