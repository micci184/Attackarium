name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-rls:
    name: PostgreSQL Migrations & RLS Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: attackarium
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations and run RLS boundary tests
        env:
          PGPASSWORD: ci_test_password
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/rollup_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/metadata_sanitization_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/sensor_patch_status_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/sensor_overload_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/cve_observation_context_test.sql
          psql -h 127.0.0.1 -U postgres -d attackarium -v ON_ERROR_STOP=1 -f supabase/tests/ops_alert_state_test.sql

  ingest-tests:
    name: Ingest Edge Function Security & Idempotency Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ingest core tests
        run: node --test supabase/functions/ingest/ingest.test.ts
      - name: Run KEV and EPSS sync tests
        run: node --test jobs/threat-intel/threat-intel.test.ts
      - name: Run candidate CVE matching tests
        run: node --test jobs/cve-matching/cve-matching.test.ts
      - name: Run sensor patch freshness check tests
        run: node --test jobs/patch-freshness/patch-freshness.test.ts
      - name: Run ops alert tests (shared core, Edge Function handler)
        run: |
          node --test jobs/ops-alerts/ops-alerts.test.ts supabase/functions/ops-alerts/handler.test.ts
          shellcheck supabase/scripts/setup_ops_alerts.sh

  sensor-tests:
    name: Sensor Collector & Shipper Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run HTTP collector security tests
        run: |
          shellcheck sensors/http-collector/generate_tls_cert.sh
          python3 -m unittest discover -s sensors/http-collector -p 'test_*.py' -v
      - name: Run Shipper spool, HMAC & retry tests
        run: python3 -m unittest discover -s sensors/shipper -p 'test_*.py' -v
      - name: Run OpenCanary config tests
        run: python3 -m unittest discover -s sensors/opencanary -p 'test_*.py' -v
      - name: Run host automatic-update recorder tests
        run: |
          shellcheck sensors/host/record_os_update_status.sh
          python3 -m unittest discover -s sensors/host -p 'test_*.py' -v

  e2e-signature-pipeline:
    name: E2E Signature to Candidate CVE Pipeline (Loopback Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run collector -> shipper -> ingest -> CVE matching E2E test
        run: node --test tests/e2e/signature-pipeline.test.ts

  web:
    name: Web App Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - env:
          USE_MOCK: "true"
        run: npm run build

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra-validate:
    name: Terraform Format & Validate (No Apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws-sensor
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize without backend and validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Syntax-check egress verification script
        run: bash -n scripts/verify_egress.sh
      - name: Lint patch window script
        run: |
          bash -n scripts/patch_window.sh
          bash -n scripts/patch_sensor.sh
          shellcheck scripts/patch_window.sh scripts/patch_sensor.sh
      - name: Run patch window and operator wrapper tests (stubbed nft/apt/terraform/aws/ssh)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
