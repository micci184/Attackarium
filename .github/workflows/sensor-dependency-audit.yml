name: Dependency vulnerability audit

# The sensor's Python packages (OpenCanary, Twisted, ...) parse attacker input
# but are not covered by OS automatic updates (ADR-027), so known advisories are
# checked here: on every PR, on main, and weekly, because new advisories appear
# without any code change. A weekly failure emails the
# maintainer. The web app's production npm dependencies are checked the same way.
#
# Runs on every PR (not only dependency changes): an ignore below is justified
# by the decoy configuration, so a config-only PR must be re-checked too.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "sensors/opencanary/requirements.txt"
      - "apps/web/package-lock.json"
  schedule:
    - cron: "43 1 * * 1" # Mondays 01:43 UTC (10:43 JST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensor-python:
    name: Sensor Python packages (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the sensor host's Python (Ubuntu 24.04)
      - name: Install the pinned set with hash checks
        run: |
          python -m venv /tmp/sensor-venv
          /tmp/sensor-venv/bin/python -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r sensors/opencanary/requirements.txt
      - name: Dependency consistency (only OpenCanary's own pins may be overridden)
        # --no-deps would hide a conflict between the overrides themselves
        # (for example Twisted 26.10 requiring zope.interface >= 8).
        run: |
          problems="$(/tmp/sensor-venv/bin/python -m pip check | grep -v '^opencanary ' || true)"
          if [ -n "$problems" ]; then
            echo "$problems"
            exit 1
          fi
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit sensors/opencanary/requirements.txt
        # Ignored, with reasons (re-check when a fix is released):
        # - GHSA-8pqf-f4m5-798g: ReDoS in Twisted's IMAP4 server. No fixed
        #   release yet; the sensor does not run an IMAP decoy (remove this
        #   ignore before enabling one in opencanary.conf).
        run: >-
          pip-audit -r sensors/opencanary/requirements.txt
          --no-deps --disable-pip --progress-spinner off
          --ignore-vuln GHSA-8pqf-f4m5-798g

  web-npm:
    name: Web production dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
