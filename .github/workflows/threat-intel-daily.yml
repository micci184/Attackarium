name: Daily KEV and EPSS sync

# The daily run (08:15 UTC, after FIRST publishes EPSS) is pg_cron ->
# observation-jobs Edge Function (migration 20261128000004), because GitHub
# Actions schedules run hours late here. This workflow is a manual fallback
# only; the sync is idempotent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threat-intel-daily
  cancel-in-progress: false

jobs:
  sync:
    name: Sync CISA KEV and FIRST EPSS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping KEV/EPSS sync: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 0
          fi
          node jobs/threat-intel/run.ts
