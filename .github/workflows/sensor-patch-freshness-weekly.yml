name: Weekly sensor patch freshness check

# Safety net for automatic OS security updates (ADR-027). The run FAILS when an
# active sensor is not current, so GitHub notifies the maintainer by email.
# Logs are public: the check prints counts only, never sensor IDs or dates.
on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (10:17 JST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sensor-patch-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Verify active sensors are current on OS updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node jobs/patch-freshness/run.ts
