name: Operator alerts (Slack)

# #32: check sensor heartbeat, OS update freshness, active sensors, and
# database size, and notify Slack when an alert starts, resolves, or is still
# active a day later (state in public.ops_alert_state, shared with the primary
# runner).
#
# The PRIMARY runner is the `ops-alerts` Edge Function, called every 15 minutes
# by pg_cron, because GitHub Actions schedules run hours late here. This
# workflow:
# - scheduled (best effort, hourly): WATCHDOG only. It alerts when the Edge
#   Function has not completed a run for 60 minutes. It never posts the health
#   alerts, so the two runners cannot post the same transition twice.
# - manual (Run workflow): the full check; send_test verifies Slack delivery.
# A run fails only when it cannot run (GitHub emails the workflow's owner if
# Actions notifications are on). Logs are public: counts only.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Also post a test message to Slack (verifies the webhook)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ops-alerts
  cancel-in-progress: false

jobs:
  check:
    name: Check sensor and database health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate and notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Optional repository variable; defaults to the Free plan's 500 MB.
          OPS_DB_QUOTA_MB: ${{ vars.OPS_DB_QUOTA_MB }}
          OPS_ALERTS_SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && 'true' || 'false' }}
          OPS_ALERTS_MODE: ${{ github.event_name == 'schedule' && 'watchdog' || 'full' }}
        run: node jobs/ops-alerts/run.ts
